name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Detectar gestor de paquetes
      id: detect-pm
      run: |
        if [ -f "pnpm-lock.yaml" ]; then
          echo "pm=pnpm" >> $GITHUB_OUTPUT
          echo "📦 Detectado: pnpm"
        elif [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
          echo "📦 Detectado: Yarn"
        else
          echo "pm=npm" >> $GITHUB_OUTPUT
          echo "📦 Detectado: npm"
        fi
    
    - name: Setup pnpm
      if: steps.detect-pm.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Instalar dependencias (npm)
      if: steps.detect-pm.outputs.pm == 'npm'
      run: npm install
    
    - name: Instalar dependencias (yarn)
      if: steps.detect-pm.outputs.pm == 'yarn'
      run: yarn install
    
    - name: Instalar dependencias (pnpm)
      if: steps.detect-pm.outputs.pm == 'pnpm'
      run: pnpm install
    
    - name: Success
      run: |
        echo "✅ CI Completado con ${{ steps.detect-pm.outputs.pm }}"
