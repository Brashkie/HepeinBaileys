name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Detectar gestor de paquetes
      id: detect-pm
      run: |
        if [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT
        fi

    - name: Instalar dependencias (npm)
      if: steps.detect-pm.outputs.pm == 'npm'
      run: npm install

    - name: Instalar dependencias (yarn)
      if: steps.detect-pm.outputs.pm == 'yarn'
      run: yarn install

    - name: Build
      run: |
        if [ "${{ steps.detect-pm.outputs.pm }}" = "yarn" ]; then
          yarn build
        else
          npm run build
        fi

    - name: Publicar en npm
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      continue-on-error: true
