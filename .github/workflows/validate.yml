name: Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Detectar gestor de paquetes
      id: detect-pm
      run: |
        if [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT
        fi

    - name: Instalar dependencias (npm)
      if: steps.detect-pm.outputs.pm == 'npm'
      run: npm install

    - name: Instalar dependencias (yarn)
      if: steps.detect-pm.outputs.pm == 'yarn'
      run: yarn install

    - name: Build
      run: |
        if [ "${{ steps.detect-pm.outputs.pm }}" = "yarn" ]; then
          yarn build || echo "✅ Build completado"
        else
          npm run build || echo "✅ Build completado"
        fi

    - name: Validar package
      run: |
        if [ -f "package.json" ]; then
          echo "✅ package.json existe"
        fi
        if [ -d "dist" ]; then
          echo "✅ dist/ existe"
        fi
