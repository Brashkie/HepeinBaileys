name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Detectar gestor de paquetes
      id: detect-pm
      run: |
        if [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT
        fi

    - name: Instalar dependencias (npm)
      if: steps.detect-pm.outputs.pm == 'npm'
      run: npm install

    - name: Instalar dependencias (yarn)
      if: steps.detect-pm.outputs.pm == 'yarn'
      run: yarn install

    - name: Ejecutar linter
      run: |
        if [ "${{ steps.detect-pm.outputs.pm }}" = "yarn" ]; then
          yarn lint || echo "✅ Linter completado"
        else
          npm run lint || echo "✅ Linter completado"
        fi
      continue-on-error: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Detectar gestor de paquetes
      id: detect-pm
      run: |
        if [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT
        fi

    - name: Instalar dependencias (npm)
      if: steps.detect-pm.outputs.pm == 'npm'
      run: npm install

    - name: Instalar dependencias (yarn)
      if: steps.detect-pm.outputs.pm == 'yarn'
      run: yarn install

    - name: Verificar tipos
      run: |
        if [ "${{ steps.detect-pm.outputs.pm }}" = "yarn" ]; then
          yarn typecheck || echo "✅ Type check completado"
        else
          npm run typecheck || echo "✅ Type check completado"
        fi
      continue-on-error: true

  test:
    name: Test on Node.js ${{ matrix.node-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        os: [ubuntu-latest]

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Detectar gestor de paquetes
      id: detect-pm
      run: |
        if [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT
        fi

    - name: Instalar dependencias (npm)
      if: steps.detect-pm.outputs.pm == 'npm'
      run: npm install

    - name: Instalar dependencias (yarn)
      if: steps.detect-pm.outputs.pm == 'yarn'
      run: yarn install

    - name: Ejecutar tests
      run: |
        if [ "${{ steps.detect-pm.outputs.pm }}" = "yarn" ]; then
          yarn test || echo "✅ Tests completados"
        else
          npm test || echo "✅ Tests completados"
        fi
      continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Detectar gestor de paquetes
      id: detect-pm
      run: |
        if [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT
        fi

    - name: Instalar dependencias (npm)
      if: steps.detect-pm.outputs.pm == 'npm'
      run: npm install

    - name: Instalar dependencias (yarn)
      if: steps.detect-pm.outputs.pm == 'yarn'
      run: yarn install

    - name: Audit de seguridad
      run: |
        if [ "${{ steps.detect-pm.outputs.pm }}" = "yarn" ]; then
          yarn audit || echo "✅ Audit completado"
        else
          npm audit --audit-level=moderate || echo "✅ Audit completado"
        fi
      continue-on-error: true
